name: Redacted secret scan

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    # main is an unchanged upstream mirror; manual runs there intentionally skip.
    # Pull requests use GitHub's merge ref and scan the complete fork deviation.
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Standalone CLI avoids the organization license requirement of gitleaks-action.
      # No report or artifact upload: only fully redacted scanner output reaches CI.
      - name: Require the mirrored main base
        run: git rev-parse --verify 'refs/remotes/origin/main^{commit}' > /dev/null
      - name: Scan all fork deviations with pinned Gitleaks
        run: >-
          docker run --rm --network none
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4
          git /repo --log-opts=origin/main..HEAD --redact=100 --no-banner
